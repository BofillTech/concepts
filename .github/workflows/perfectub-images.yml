name: Build Perfectub concept images

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/build_perfectub_images.py"
      - ".github/workflows/perfectub-images.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perfectub-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow and NumPy
        run: pip install pillow==11.0.0 numpy==2.1.3

      - name: Download and process photos (retries anything braktub.com's bot check blocks)
        id: build
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            if python .github/scripts/build_perfectub_images.py; then exit 0; fi
            echo "Attempt $attempt left images missing; waiting before retrying."
            sleep 120
          done
          exit 1

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add perfectub/img
          if git diff --cached --quiet; then
            echo "No new images to commit."
          else
            git commit -m "Perfectub concept: add processed photos"
            git pull --rebase origin main
            git push
          fi

      - name: Report missing images
        if: steps.build.outcome == 'failure'
        run: |
          echo "Some images are still missing. Re-run this workflow to fetch only the missing ones."
          exit 1
