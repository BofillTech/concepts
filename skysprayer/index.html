const un=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:un(SALT),iterations:ITER},km,256));
}
async function open(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:un(IV)},key,un(CT));
  const html=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open();document.write(html);document.close();
}
function savedKey(){
  try{
    const x=localStorage.getItem(LSX);
    if(x&&Date.now()>+x){localStorage.removeItem(LS);localStorage.removeItem(LSX);return null}
    const h=localStorage.getItem(LS);
    return h?Uint8Array.from(h.match(/../g).map(b=>parseInt(b,16))):null;
  }catch(e){return null}
}
(async()=>{const k=savedKey();if(k){try{await open(k)}catch(e){try{localStorage.removeItem(LS);localStorage.removeItem(LSX)}catch(_){}}}})();
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const go=document.getElementById("go"),err=document.getElementById("err");
  go.disabled=true;go.textContent="Unlocking…";err.style.display="none";
  try{
    const raw=await derive(document.getElementById("pw").value);
    await open(raw);
    if(document.getElementById("rm")&&document.getElementById("rm").checked){
      try{
        localStorage.setItem(LS,[...raw].map(b=>b.toString(16).padStart(2,"0")).join(""));
        localStorage.setItem(LSX,String(Date.now()+30*24*60*60*1000));
      }catch(e){}
    }
  }catch(e){
    err.style.display="block";go.disabled=false;go.textContent="Unlock";
  }
});
